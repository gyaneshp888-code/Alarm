name: nova_alarm
description: "Premium Futuristic AI Alarm & Vault App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.1
  local_auth: ^2.2.0
  lottie: ^3.1.2
  rive: ^0.13.5
  glassmorphism: ^3.0.0
  weather: ^3.0.1
  flutter_animate: ^4.5.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.1
  flutter_staggered_grid_view: ^0.7.0
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
    - assets/icons/
